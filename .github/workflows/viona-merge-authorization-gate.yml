# Viona Merge Authorization Gate Dispatcher
# Canonical required context is the explicit Checks API check run
# "Viona Merge Authorization Gate" — not this workflow job result.
name: Viona Merge Authorization Gate Dispatcher

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number (integer as string)
        required: true
        type: string
      head_sha:
        description: Full 40-character PR head SHA
        required: true
        type: string
      base_branch:
        description: Base branch (exact)
        required: true
        type: choice
        options:
          - master
      merge_mode:
        description: Merge mode (exact)
        required: true
        type: choice
        options:
          - squash
      authority:
        description: Authority (exact)
        required: true
        type: choice
        options:
          - MERGE
      freeze_scope:
        description: Freeze remediation scope (exact while freeze active)
        required: true
        type: choice
        options:
          - FREEZE_EXCEPTION_FOR_MERGE_GUARDRAIL_REMEDIATION_ONLY
      reviewed_scope_digest:
        description: Deterministic reviewed-scope digest (SHA-256 hex)
        required: true
        type: string

# Bind concurrency to repository + PR + head. cancel-in-progress=false so an
# older run cannot be cancelled into a reusable success race.
concurrency:
  group: viona-merge-authorization-gate-${{ github.repository }}-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  evaluate_merge_authorization:
    name: Evaluate Viona Merge Authorization Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Evaluate Viona Merge Authorization Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIONA_GATE_PR_NUMBER: ${{ inputs.pr_number }}
          VIONA_GATE_HEAD_SHA: ${{ inputs.head_sha }}
          VIONA_GATE_BASE_BRANCH: ${{ inputs.base_branch }}
          VIONA_GATE_MERGE_MODE: ${{ inputs.merge_mode }}
          VIONA_GATE_AUTHORITY: ${{ inputs.authority }}
          VIONA_GATE_FREEZE_SCOPE: ${{ inputs.freeze_scope }}
          VIONA_GATE_REVIEWED_SCOPE_DIGEST: ${{ inputs.reviewed_scope_digest }}
          VIONA_GATE_RUN_ID: ${{ github.run_id }}
          VIONA_GATE_REPOSITORY: ${{ github.repository }}
        run: node scripts/viona-merge-authorization-gate.mjs
