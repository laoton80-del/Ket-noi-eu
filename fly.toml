# VIONA staging REST API — Fly.io Frankfurt (plan: VIONA.STAGING.PUBLIC_API_DEPLOY_PLAN.1)
app = 'viona-api-staging-eu'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile.api'

[env]
  NODE_ENV = 'production'
  # Pack30D-7 — identifies this Fly app as staging so real-provider gates can allow Twilio Test
  # Credentials execution when PACK30_REAL_PROVIDER_EXECUTION_ENABLED=true (Fly secret only).
  VIONA_DEPLOYMENT_STAGE = 'staging'
  MARKETING_AUTO_POSTER_ENABLED = '0'
  TRUST_PROXY_HOPS = '1'
  JWT_EXPIRES_IN = '7d'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
